[package]
name = "ztile"
version = "0.1.0"
edition = "2024"

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_UI_Accessibility", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

