[package]
name = "ztile"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Window layout groups for KDE Plasma: the resident part (tiny daemon + KWin script)"
repository = "https://github.com/Zana-C/ZTile"

[dependencies]
dbus = "0.9.12"
libc = "0.2.191"
png = "0.18.1"
resvg = { version = "0.50.0", default-features = false }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
ztile-core = { path = "../core" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
